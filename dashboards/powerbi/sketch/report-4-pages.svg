    <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Trang 2 – Chi tiết sản phẩm và danh mục</text>
    <rect x="20" y="45" width="140" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="90" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Thời gian</text>
    <rect x="170" y="45" width="110" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="225" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Sàn</text>
    <rect x="290" y="45" width="130" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="355" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Danh mục</text>
    <rect x="20" y="90" width="350" height="290" rx="6" fill="#f9fafb" stroke="#d1d5db"/>

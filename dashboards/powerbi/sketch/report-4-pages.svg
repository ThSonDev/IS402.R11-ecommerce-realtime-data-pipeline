    <rect x="130" y="130" width="220" height="14" fill="#60a5fa"/><text x="35" y="141" font-size="10" fill="#374151">electronics</text>
    <rect x="130" y="160" width="60" height="14" fill="#60a5fa"/><text x="35" y="171" font-size="10" fill="#374151">Chưa phân loại</text>
    <rect x="130" y="190" width="45" height="14" fill="#60a5fa"/><text x="35" y="201" font-size="10" fill="#374151">appliances</text>
    <rect x="130" y="220" width="35" height="14" fill="#60a5fa"/><text x="35" y="231" font-size="10" fill="#374151">computers</text>
    <rect x="130" y="250" width="12" height="14" fill="#60a5fa"/><text x="35" y="261" font-size="10" fill="#374151">furniture</text>
    <rect x="130" y="280" width="6" height="14" fill="#60a5fa"/><text x="35" y="291" font-size="10" fill="#374151">...</text>
    <rect x="390" y="90" width="350" height="135" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="405" y="113" font-size="14" font-weight="600" fill="#111827">Top 10 brand theo GMV</text>
    <rect x="410" y="128" width="250" height="14" fill="#60a5fa"/><rect x="410" y="152" width="190" height="14" fill="#60a5fa"/><rect x="410" y="176" width="130" height="14" fill="#60a5fa"/><rect x="410" y="200" width="80" height="14" fill="#60a5fa"/>
    <rect x="390" y="245" width="350" height="135" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="405" y="268" font-size="14" font-weight="600" fill="#111827">Top 10 sản phẩm theo GMV</text>
    <rect x="410" y="283" width="250" height="14" fill="#60a5fa"/><rect x="410" y="307" width="150" height="14" fill="#60a5fa"/><rect x="410" y="331" width="110" height="14" fill="#60a5fa"/><rect x="410" y="355" width="80" height="14" fill="#60a5fa"/>
    <rect x="20" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="80" y="414" text-anchor="middle" font-size="12" fill="#374151">Tổng quan</text>
    <rect x="150" y="395" width="120" height="28" rx="14" fill="#2563eb"/><text x="210" y="414" text-anchor="middle" font-size="12" fill="#fff">Sản phẩm</text>
    <rect x="280" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="340" y="414" text-anchor="middle" font-size="12" fill="#374151">Sàn × tỉnh</text>
    <rect x="410" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="470" y="414" text-anchor="middle" font-size="12" fill="#374151">Gian lận</text>
  </g>

  <!-- ===== Trang 3 ===== -->
  <g transform="translate(30,545)">
    <rect width="760" height="440" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Trang 3 – Theo sàn × tỉnh (bản đồ)</text>
    <rect x="20" y="45" width="140" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="90" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Thời gian</text>
    <rect x="170" y="45" width="110" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="225" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Sàn</text>
    <rect x="20" y="90" width="450" height="290" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="35" y="113" font-size="14" font-weight="600" fill="#111827">Bản đồ tỉnh/thành, màu theo GMV</text>
    <path d="M250 135 L280 150 L270 190 L300 230 L285 280 L300 330 L260 360 L235 320 L245 270 L220 220 L235 170 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="250" font-size="12" fill="#6b7280">(hình minh họa, bản đồ thật do Power BI vẽ)</text>
    <rect x="490" y="90" width="250" height="290" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="505" y="113" font-size="14" font-weight="600" fill="#111827">Bảng GMV: sàn × miền</text>
    <text x="505" y="140" font-size="12" fill="#374151">          Bắc   Trung   Nam</text>
    <text x="505" y="165" font-size="12" fill="#374151">Tiki     ###   ###    ###</text>
    <text x="505" y="190" font-size="12" fill="#374151">Shopee   ###   ###    ###</text>
    <text x="505" y="215" font-size="12" fill="#374151">Lazada   ###   ###    ###</text>
    <rect x="20" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="80" y="414" text-anchor="middle" font-size="12" fill="#374151">Tổng quan</text>
    <rect x="150" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="210" y="414" text-anchor="middle" font-size="12" fill="#374151">Sản phẩm</text>
    <rect x="280" y="395" width="120" height="28" rx="14" fill="#2563eb"/><text x="340" y="414" text-anchor="middle" font-size="12" fill="#fff">Sàn × tỉnh</text>
    <rect x="410" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="470" y="414" text-anchor="middle" font-size="12" fill="#374151">Gian lận</text>
  </g>

  <!-- ===== Trang 4 ===== -->
  <g transform="translate(810,545)">
    <rect width="760" height="440" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Trang 4 – Gian lận và sự cố</text>
    <rect x="20" y="45" width="140" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="90" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Thời gian</text>
    <rect x="170" y="45" width="110" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="225" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Sàn</text>
    <rect x="20" y="90" width="165" height="70" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="102" y="116" text-anchor="middle" font-size="12" fill="#991b1b">Đơn gắn cờ gian lận</text><text x="102" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">###</text>
    <rect x="205" y="90" width="165" height="70" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="287" y="116" text-anchor="middle" font-size="12" fill="#991b1b">Tỷ lệ đơn gian lận</text><text x="287" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">##.#%</text>
    <rect x="390" y="90" width="165" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6"/><text x="472" y="116" text-anchor="middle" font-size="12" fill="#1e40af">Số cảnh báo phát hiện</text><text x="472" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">###</text>
    <rect x="575" y="90" width="165" height="70" rx="6" fill="#fff7ed" stroke="#f97316"/><text x="657" y="116" text-anchor="middle" font-size="12" fill="#9a3412">Số event đến trễ</text><text x="657" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">###</text>
    <rect x="20" y="175" width="335" height="205" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="35" y="198" font-size="14" font-weight="600" fill="#111827">Đơn gian lận theo thời gian</text>
    <polyline points="40,350 90,345 140,340 190,265 240,335 290,330 335,320" fill="none" stroke="#dc2626" stroke-width="3"/>
    <rect x="365" y="175" width="375" height="205" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="380" y="198" font-size="14" font-weight="600" fill="#111827">Gian lận thực tế so với hệ thống phát hiện</text>
    <text x="380" y="214" font-size="10" fill="#6b7280">Thực tế: fact_events. Phát hiện: dbo.alerts. So số lượng, không so từng đơn.</text>
    <rect x="380" y="224" width="10" height="10" fill="#f87171"/><text x="395" y="233" font-size="10" fill="#374151">Gian lận thực tế</text>
    <rect x="525" y="224" width="10" height="10" fill="#60a5fa"/><text x="540" y="233" font-size="10" fill="#374151">Hệ thống phát hiện</text>
    <rect x="385" y="280" width="28" height="70" fill="#f87171"/><rect x="415" y="290" width="28" height="60" fill="#60a5fa"/>
    <rect x="473" y="250" width="28" height="100" fill="#f87171"/><rect x="503" y="265" width="28" height="85" fill="#60a5fa"/>
    <rect x="561" y="310" width="28" height="40" fill="#f87171"/><rect x="591" y="305" width="28" height="45" fill="#60a5fa"/>
    <rect x="649" y="340" width="28" height="10" fill="none" stroke="#f87171" stroke-dasharray="3,2"/><rect x="679" y="300" width="28" height="50" fill="#60a5fa"/>
    <text x="414" y="365" text-anchor="middle" font-size="9" fill="#374151">bot</text><text x="502" y="365" text-anchor="middle" font-size="9" fill="#374151">multi_account</text><text x="590" y="365" text-anchor="middle" font-size="9" fill="#374151">price_glitch</text><text x="678" y="365" text-anchor="middle" font-size="9" fill="#374151">payment_outage</text>
    <text x="20" y="391" font-size="10" fill="#6b7280">Lưu ý: payment_outage không có nhãn trên từng event nên không có cột gian lận thực tế.</text>
    <rect x="20" y="398" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="80" y="417" text-anchor="middle" font-size="12" fill="#374151">Tổng quan</text>
    <rect x="150" y="398" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="210" y="417" text-anchor="middle" font-size="12" fill="#374151">Sản phẩm</text>
    <rect x="280" y="398" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="340" y="417" text-anchor="middle" font-size="12" fill="#374151">Sàn × tỉnh</text>
    <rect x="410" y="398" width="120" height="28" rx="14" fill="#2563eb"/><text x="470" y="417" text-anchor="middle" font-size="12" fill="#fff">Gian lận</text>

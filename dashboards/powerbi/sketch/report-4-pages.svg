<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1600" height="1040" fill="#f3f4f6"/>
  <text x="800" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Phác thảo bố cục báo cáo Power BI (4 trang)</text>
  <text x="800" y="62" text-anchor="middle" font-size="14" fill="#4b5563"></text>

  <!-- ===== Trang 1 ===== -->
  <g transform="translate(30,85)">
    <rect width="760" height="440" rx="8" fill="#ffffff" stroke="#9ca3af"/>
    <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Trang 1 – Tổng quan</text>
    <!-- filters -->
    <rect x="20" y="45" width="140" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="90" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Thời gian</text>
    <rect x="170" y="45" width="110" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="225" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Sàn</text>
    <rect x="290" y="45" width="130" height="28" rx="4" fill="#eef2ff" stroke="#6366f1"/><text x="355" y="64" text-anchor="middle" font-size="13" fill="#3730a3">Lọc: Danh mục</text>
    <!-- KPI cards -->
    <rect x="20" y="90" width="170" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="105" y="118" text-anchor="middle" font-size="13" fill="#065f46">GMV</text><text x="105" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">### VND</text>
    <rect x="205" y="90" width="170" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="290" y="118" text-anchor="middle" font-size="13" fill="#065f46">Số đơn</text><text x="290" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">###</text>
    <rect x="390" y="90" width="170" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="475" y="118" text-anchor="middle" font-size="13" fill="#065f46">Giá trị TB mỗi đơn (AOV)</text><text x="475" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">### VND</text>
    <rect x="575" y="90" width="165" height="70" rx="6" fill="#ecfdf5" stroke="#10b981"/><text x="657" y="118" text-anchor="middle" font-size="13" fill="#065f46">Tỷ lệ chuyển đổi</text><text x="657" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">##.#%</text>
    <!-- charts -->
    <rect x="20" y="175" width="450" height="205" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="35" y="198" font-size="14" font-weight="600" fill="#111827">Biểu đồ đường: GMV và số đơn theo thời gian</text>
    <polyline points="40,350 100,320 160,335 220,290 280,300 340,260 400,275 450,240" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="490" y="175" width="250" height="205" rx="6" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="505" y="198" font-size="14" font-weight="600" fill="#111827">Biểu đồ cột: GMV theo sàn</text>
    <rect x="525" y="290" width="40" height="70" fill="#60a5fa"/><rect x="590" y="250" width="40" height="110" fill="#60a5fa"/><rect x="655" y="310" width="40" height="50" fill="#60a5fa"/>
    <text x="545" y="375" text-anchor="middle" font-size="11" fill="#374151">Tiki</text><text x="610" y="375" text-anchor="middle" font-size="11" fill="#374151">Shopee</text><text x="675" y="375" text-anchor="middle" font-size="11" fill="#374151">Lazada</text>
    <!-- nav -->
    <rect x="20" y="395" width="120" height="28" rx="14" fill="#2563eb"/><text x="80" y="414" text-anchor="middle" font-size="12" fill="#fff">Tổng quan</text>
    <rect x="150" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="210" y="414" text-anchor="middle" font-size="12" fill="#374151">Sản phẩm</text>
    <rect x="280" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="340" y="414" text-anchor="middle" font-size="12" fill="#374151">Sàn × tỉnh</text>
    <rect x="410" y="395" width="120" height="28" rx="14" fill="#e5e7eb"/><text x="470" y="414" text-anchor="middle" font-size="12" fill="#374151">Gian lận</text>
    <text x="740" y="414" text-anchor="end" font-size="11" fill="#6b7280">Nút điều hướng</text>

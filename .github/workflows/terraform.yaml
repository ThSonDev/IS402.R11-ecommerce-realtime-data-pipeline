name: terraform

# PR touching infra/: plan only, so the reviewer sees what would change.
# Run by hand (Actions tab -> terraform -> Run workflow, branch main): plan, apply or destroy.
on:
  pull_request:
    paths: ["infra/**", "stream/reference/**", "stream/query.asaql", ".github/workflows/terraform.yaml"]
  workflow_dispatch:
    inputs:
      # destroy-eventhubs: turn off only the hourly-billed Event Hubs (plus the ASA input on it),
      # keep the lake, SQL and Synapse. Stop the ASA job first. `apply` brings it back.
      action:
        type: choice
        options: [plan, apply, destroy-eventhubs, destroy]
        default: plan

permissions:
  id-token: write # allow token OIDC from GitHub
  contents: read

# Never run two Terraform jobs on the same state at once.
concurrency: terraform

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false # wrapper adds lines to stdout, breaks `show -json | jq`
      - run: terraform init -input=false
      # inputs.action is empty on pull_request, so PRs always plan.
      - if: ${{ !inputs.action || inputs.action == 'plan' }}
        run: terraform plan -input=false -out=tfplan
      # Red check when the plan deletes anything (a replace is a delete + create).
      # Not a required check: a deliberate destroy can still be merged after review.
      - if: ${{ !inputs.action || inputs.action == 'plan' }}
        name: Fail on destroy or replace
        run: |
          terraform show -json tfplan |
            jq -r '(.resource_changes // [])[] | select(.change.actions | index("delete")) | "will destroy: \(.address)"' |
            tee destroys.txt
          test ! -s destroys.txt
      - if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve
      - if: inputs.action == 'destroy-eventhubs'
        run: terraform destroy -input=false -auto-approve -target azurerm_eventhub_namespace.main
      - if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
